<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23f05033'/><g stroke='white' stroke-width='1.4' fill='none'><path d='M5 12 V4'/><path d='M5 10.5 Q8.5 10.5 11 8'/></g><circle cx='5' cy='12' r='1.6' fill='white'/><circle cx='5' cy='4' r='1.6' fill='white'/><circle cx='11' cy='8' r='1.6' fill='white'/></svg>">
<title>Git Graph</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0;
         padding: 1.5rem 2rem; background: #fafafa; color: #222; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  h2 { font-size: 1rem; margin: 0; }
  .meta { color: #666; font-size: .85rem; margin-bottom: 1rem; }
  .controls { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap;
              background: #fff; border: 1px solid #ddd; border-radius: 6px;
              padding: .6rem 1rem; margin-bottom: 1.25rem; font-size: .9rem; }
  .controls label { margin-right: .4rem; color: #555; }
  select { font: inherit; padding: .15rem .3rem; }
  section.chart { background: #fff; border: 1px solid #ddd; border-radius: 6px;
                  padding: 1rem; margin-bottom: 1.25rem; }
  .chart-head { display: flex; gap: 1rem; align-items: center; margin-bottom: .5rem; }
  .chart-head label { font-size: .85rem; color: #555; }
  svg { display: block; width: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; margin-top: .6rem;
            font-size: .8rem; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend i { width: .8rem; height: .8rem; border-radius: 2px; display: inline-block; }
  .desc { margin-top: .8rem; font-size: .85rem; color: #444; line-height: 1.5; }
  .details { font-size: .85rem; color: #333; }
  .details-head { font-weight: 600; margin-bottom: .25rem; }
  .details ul { margin: .25rem 0 0; padding-left: 1.4rem; }
  .details ul ul { margin: .1rem 0; }
  .details li { margin: .1rem 0; }
  .details li i { width: .7rem; height: .7rem; border-radius: 2px;
                  display: inline-block; margin-right: .35rem; }
  .details .hint { color: #999; font-style: italic; }
  .details .muted { color: #999; }
  .empty { color: #888; font-style: italic; padding: 2rem; text-align: center; }
</style>
</head>
<body>
<h1>Git Graph</h1>
<div class="meta" id="summary"></div>
<div class="controls">
  <span><label for="res">Resolution</label>
    <select id="res">
      <option value="week">Week</option>
      <option value="month" selected>Month</option>
      <option value="year">Year</option>
    </select></span>
  <span><label for="metric">Metric</label>
    <select id="metric">
      <option value="commits" selected>Commits</option>
      <option value="lines">Lines changed</option>
    </select></span>
  <span><label for="stack">Stack bars by</label>
    <select id="stack">
      <option value="repo" selected>Repo</option>
      <option value="author">Author</option>
    </select></span>
  <span><label for="year">Year</label>
    <select id="year">
      <option value="all" selected>All</option>
    </select></span>
</div>
<section class="chart">
  <div id="chart"></div>
  <div id="legend" class="legend"></div>
  <div id="desc" class="desc"></div>
</section>
<div id="details" class="details"><span class="hint">Hover over a bar to filter this list</span></div>
<script>
const DATA = __DATA__;
const NS = "http://www.w3.org/2000/svg";
const PALETTE = ["#4e79a7","#f28e2b","#e15759","#76b7b2","#59a14f","#edc948",
                 "#b07aa1","#ff9da7","#9c755f","#bab0ac","#8cd17d","#86bcb6"];
const TOP_N = 10;

const pad = value => String(value).padStart(2, "0");
const color = index => PALETTE[index % PALETTE.length];
const control = id => document.getElementById(id);
const sortDesc = entries => entries.sort((a, b) => b[1] - a[1]);
const formatDate = seconds => new Date(seconds * 1000).toLocaleDateString(
  "en-US", { year: "numeric", month: "short", day: "numeric" });

function seriesKey(commit, stackBy) {
  return stackBy === "author" ? commit.author : DATA.repos[commit.repo];
}

function otherKey(commit, stackBy) {
  return stackBy === "author" ? DATA.repos[commit.repo] : commit.author;
}

function bucketStart(seconds, resolution) {
  const date = new Date(seconds * 1000);
  if (resolution === "year")
    return new Date(date.getFullYear(), 0, 1).getTime() / 1000;
  if (resolution === "month")
    return new Date(date.getFullYear(), date.getMonth(), 1).getTime() / 1000;
  const day = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  day.setDate(day.getDate() - ((day.getDay() + 6) % 7)); // ISO week starts Monday
  return day.getTime() / 1000;
}

function nextBucket(seconds, resolution) {
  const date = new Date(seconds * 1000);
  if (resolution === "year")
    return new Date(date.getFullYear() + 1, 0, 1).getTime() / 1000;
  if (resolution === "month")
    return new Date(date.getFullYear(), date.getMonth() + 1, 1).getTime() / 1000;
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + 7)
    .getTime() / 1000;
}

function bucketLabel(seconds, resolution) {
  const date = new Date(seconds * 1000);
  if (resolution === "year") return String(date.getFullYear());
  if (resolution === "month")
    return date.getFullYear() + "-" + pad(date.getMonth() + 1);
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) +
         "-" + pad(date.getDate());
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun",
                "Jul","Aug","Sep","Oct","Nov","Dec"];

function tickLabel(seconds, resolution, showYear) {
  const date = new Date(seconds * 1000);
  const yearSuffix = " '" + String(date.getFullYear()).slice(2);
  if (resolution === "year") return String(date.getFullYear());
  if (resolution === "month")
    return MONTHS[date.getMonth()] +
      (showYear || date.getMonth() === 0 ? yearSuffix : "");
  return MONTHS[date.getMonth()] + " " + date.getDate() +
         (showYear ? yearSuffix : "");
}

function monthLabel(seconds) {
  const date = new Date(seconds * 1000);
  return MONTHS[date.getMonth()] + " '" + String(date.getFullYear()).slice(2);
}

function weekRangeLabel(seconds, showYear) {
  const start = new Date(seconds * 1000);
  const end = new Date(seconds * 1000);
  end.setDate(end.getDate() + 6);
  const yearStart = String(start.getFullYear()).slice(2);
  const yearEnd = String(end.getFullYear()).slice(2);
  const suffix = showYear || yearStart !== yearEnd;
  const left = MONTHS[start.getMonth()] + " " + start.getDate() +
               (suffix ? " '" + yearStart : "");
  const right = MONTHS[end.getMonth()] + " " + end.getDate() +
                (suffix ? " '" + yearEnd : "");
  return `${left} – ${right}`;
}

function metricValue(commit, metric) {
  return metric === "lines" ? commit.added + commit.deleted : 1;
}

function aggregate(resolution, stackBy, metric, commits, showYear) {
  const buckets = new Map();   // bucket seconds -> Map<series name, value>
  const totals = new Map();    // series name -> total
  const cross = new Map();     // `${bucket}|${name}` -> Map<other-dim name, value>
  const crossTotals = new Map(); // series name -> Map<other-dim name, value>
  let minTime = Infinity, maxTime = -Infinity;
  for (const commit of commits) {
    const name = seriesKey(commit, stackBy);
    const other = otherKey(commit, stackBy);
    const bucket = bucketStart(commit.time, resolution);
    if (!buckets.has(bucket)) buckets.set(bucket, new Map());
    const bucketValues = buckets.get(bucket);
    const value = metricValue(commit, metric);
    bucketValues.set(name, (bucketValues.get(name) || 0) + value);
    totals.set(name, (totals.get(name) || 0) + value);
    const crossKey = bucket + "|" + name;
    if (!cross.has(crossKey)) cross.set(crossKey, new Map());
    const crossValues = cross.get(crossKey);
    crossValues.set(other, (crossValues.get(other) || 0) + value);
    if (!crossTotals.has(name)) crossTotals.set(name, new Map());
    const totalValues = crossTotals.get(name);
    totalValues.set(other, (totalValues.get(other) || 0) + value);
    if (commit.time < minTime) minTime = commit.time;
    if (commit.time > maxTime) maxTime = commit.time;
  }
  const rankedPairs = sortDesc([...totals.entries()]);
  const ranked = rankedPairs.map(([name]) => name);
  const series = ranked.slice(0, TOP_N);
  if (ranked.length > TOP_N) series.push("Other");
  const starts = [...buckets.keys()].sort((a, b) => a - b);
  const rows = [];
  if (starts.length)
    for (let bucket = starts[0];
         bucket <= starts[starts.length - 1];
         bucket = nextBucket(bucket, resolution)) {
      const bucketValues = buckets.get(bucket) || new Map();
      const cells = series.map(name => {
        if (name === "Other") {
          let sum = 0;
          for (const [key, count] of bucketValues)
            if (!series.includes(key)) sum += count;
          return sum;
        }
        return bucketValues.get(name) || 0;
      });
      const crossBySeries = new Map();
      for (const name of bucketValues.keys()) {
        const crossValues = cross.get(bucket + "|" + name);
        if (crossValues) crossBySeries.set(name, sortDesc([...crossValues]));
      }
      rows.push({ start: bucket,
                  label: resolution === "week"
                    ? weekRangeLabel(bucket, showYear)
                    : resolution === "month"
                      ? monthLabel(bucket)
                      : bucketLabel(bucket, resolution),
                  tick: tickLabel(bucket, resolution, showYear), cells,
                  cross: crossBySeries,
                  other: series.includes("Other")
                    ? sortDesc([...bucketValues]
                        .filter(([name]) => !series.includes(name)))
                    : null,
                  total: cells.reduce((sum, value) => sum + value, 0) });
    }
  const crossTotalsSorted = new Map();
  for (const [name, values] of crossTotals)
    crossTotalsSorted.set(name, sortDesc([...values]));
  const summaryCells = series.map(name => name === "Other"
    ? rankedPairs.slice(TOP_N).reduce((sum, [, value]) => sum + value, 0)
    : (totals.get(name) || 0));
  const summary = {
    label: commits.length
      ? `${formatDate(minTime)} – ${formatDate(maxTime)}`
      : "All",
    cells: summaryCells,
    cross: crossTotalsSorted,
    other: ranked.length > TOP_N ? rankedPairs.slice(TOP_N) : null,
    total: summaryCells.reduce((sum, value) => sum + value, 0),
  };
  return { series, rows, summary };
}

function niceMax(value) {
  if (value <= 0) return 1;
  const magnitude = Math.pow(10, Math.floor(Math.log10(value)));
  for (const factor of [1, 2, 2.5, 5, 10])
    if (value <= factor * magnitude) return factor * magnitude;
  return 10 * magnitude;
}

function svgEl(name, attrs) {
  const element = document.createElementNS(NS, name);
  for (const attr in attrs) element.setAttribute(attr, attrs[attr]);
  return element;
}

function textEl(x, y, str, attrs) {
  const text = svgEl("text", Object.assign(
    { x, y, "font-size": 11, fill: "#555" }, attrs));
  text.textContent = str;
  return text;
}

function formatNumber(value) {
  if (value >= 1e6) return (value / 1e6).toFixed(value % 1e6 ? 1 : 0) + "M";
  if (value >= 1e4) return (value / 1e3).toFixed(value % 1e3 ? 1 : 0) + "k";
  return String(Math.round(value * 100) / 100);
}

function mutedSpan(breakdown) {
  const span = document.createElement("span");
  span.className = "muted";
  span.textContent = " (" + breakdown
    .map(([name, count]) => `${name}: ${count.toLocaleString()}`)
    .join(", ") + ")";
  return span;
}

function showDetails(details, row, series, metric, isBar) {
  details.innerHTML = "";
  const head = document.createElement("div");
  head.className = isBar ? "details-head" : "hint";
  head.textContent = isBar
    ? `${row.label}: ${row.total.toLocaleString()} ` +
      (metric === "lines" ? "lines changed" : "commits")
    : "Hover over a bar to filter this list";
  details.appendChild(head);
  const list = document.createElement("ul");
  series.forEach((name, index) => {
    const value = row.cells[index];
    if (!value) return;
    const item = document.createElement("li");
    const swatch = document.createElement("i");
    swatch.style.background = color(index);
    item.appendChild(swatch);
    item.appendChild(
      document.createTextNode(`${name}: ${value.toLocaleString()}`));
    const breakdown = row.cross.get(name);
    if (breakdown && breakdown.length) item.appendChild(mutedSpan(breakdown));
    if (name === "Other" && row.other) {
      const subList = document.createElement("ul");
      for (const [otherName, count] of row.other) {
        const subItem = document.createElement("li");
        subItem.appendChild(
          document.createTextNode(`${otherName}: ${count.toLocaleString()}`));
        const subBreakdown = row.cross.get(otherName);
        if (subBreakdown && subBreakdown.length)
          subItem.appendChild(mutedSpan(subBreakdown));
        subList.appendChild(subItem);
      }
      item.appendChild(subList);
    }
    list.appendChild(item);
  });
  details.appendChild(list);
}

function render(resolution, stackBy, metric, commits, showYear) {
  const { series, rows, summary } =
    aggregate(resolution, stackBy, metric, commits, showYear);
  const host = control("chart");
  const legend = control("legend");
  const details = control("details");
  host.innerHTML = ""; legend.innerHTML = "";
  if (!rows.length) {
    host.innerHTML = '<div class="empty">No commits found</div>';
    details.innerHTML =
      '<span class="hint">No commits in this selection.</span>';
    return;
  }
  showDetails(details, summary, series, metric, false);
  const width = Math.max(host.clientWidth, 320), height = 300;
  const margin = { left: 56, right: 12, top: 10, bottom: 30 };
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = height - margin.top - margin.bottom;
  const axisY = margin.top + plotHeight;
  const maxValue = niceMax(Math.max(...rows.map(row => row.total)));
  const barWidth = Math.max((plotWidth / rows.length) * 0.72, 1.5);
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}` });

  for (let i = 0; i <= 4; i++) {
    const gridValue = maxValue * i / 4;
    const gridY = axisY - plotHeight * i / 4;
    svg.appendChild(svgEl("line", {
      x1: margin.left, x2: width - margin.right, y1: gridY, y2: gridY,
      stroke: "#e6e6e6" }));
    svg.appendChild(textEl(margin.left - 6, gridY + 4, formatNumber(gridValue),
      { "text-anchor": "end" }));
  }
  const labelStep = Math.ceil(rows.length / 12);
  rows.forEach((row, index) => {
    const x = margin.left + plotWidth * (index + 0.5) / rows.length;
    let y = axisY;
    series.forEach((name, seriesIndex) => {
      const value = row.cells[seriesIndex];
      if (!value) return;
      const barHeight = plotHeight * value / maxValue;
      y -= barHeight;
      svg.appendChild(svgEl("rect", {
        x: x - barWidth / 2, y, width: barWidth, height: barHeight,
        fill: color(seriesIndex) }));
    });
    if (index % labelStep === 0)
      svg.appendChild(textEl(x, axisY + 16, row.tick,
        { "text-anchor": "middle" }));
  });
  svg.appendChild(svgEl("line", {
    x1: margin.left, x2: width - margin.right, y1: axisY, y2: axisY,
    stroke: "#999" }));
  const showSummary = () => showDetails(details, summary, series, metric, false);
  svg.addEventListener("mousemove", event => {
    const bounds = svg.getBoundingClientRect();
    const graphX = (event.clientX - bounds.left) * width / bounds.width;
    const barIndex = Math.min(rows.length - 1, Math.max(0,
      Math.floor((graphX - margin.left) * rows.length / plotWidth)));
    showDetails(details, rows[barIndex], series, metric, true);
  });
  svg.addEventListener("mouseleave", showSummary);
  host.appendChild(svg);
  series.forEach((name, index) => {
    const item = document.createElement("span");
    const swatch = document.createElement("i");
    swatch.style.background = color(index);
    item.appendChild(swatch);
    item.appendChild(document.createTextNode(name));
    legend.appendChild(item);
  });
}

function plural(count, singular, pluralForm) {
  return `${count} ${count === 1 ? singular : (pluralForm || singular + "s")}`;
}

function describe(commits) {
  const target = control("desc");
  if (!commits.length) {
    target.textContent = "No commits in this selection.";
    return;
  }
  const authors = new Set(commits.map(commit => commit.author));
  const repos = new Set(commits.map(commit => commit.repo));
  const byRepo = new Map(), byAuthor = new Map();
  let added = 0, deleted = 0;
  for (const commit of commits) {
    byRepo.set(commit.repo, (byRepo.get(commit.repo) || 0) + 1);
    byAuthor.set(commit.author, (byAuthor.get(commit.author) || 0) + 1);
    added += commit.added; deleted += commit.deleted;
  }
  const topEntry = counts => sortDesc([...counts.entries()])[0];
  const [topRepo, topRepoCount] = topEntry(byRepo);
  const [topAuthor, topAuthorCount] = topEntry(byAuthor);
  const timestamps = commits.map(commit => commit.time);
  const linesPhrase = DATA.countLines
    ? `, changing ${formatNumber(added + deleted)} ` +
      `${added + deleted === 1 ? "line" : "lines"} ` +
      `(+${formatNumber(added)} / -${formatNumber(deleted)})`
    : "";
  target.textContent =
    `${plural(commits.length, "commit")} by ${plural(authors.size, "author")} ` +
    `across ${plural(repos.size, "repository", "repositories")} ` +
    `between ${formatDate(Math.min(...timestamps))} ` +
    `and ${formatDate(Math.max(...timestamps))}${linesPhrase}. ` +
    `Most active repository: ${DATA.repos[topRepo]} ` +
    `(${plural(topRepoCount, "commit")}). ` +
    `Top author: ${topAuthor} (${plural(topAuthorCount, "commit")}).`;
}

function selectedCommits() {
  const year = control("year").value;
  if (year === "all") return DATA.commits;
  const yearNumber = Number(year);
  return DATA.commits.filter(
    commit => new Date(commit.time * 1000).getFullYear() === yearNumber);
}

function refresh() {
  const commits = selectedCommits();
  render(control("res").value,
         control("stack").value,
         control("metric").value,
         commits,
         control("year").value === "all");
  describe(commits);
}

const baseNames = DATA.roots.map(root =>
  (root.split(/[\\/]/).filter(Boolean).pop() || "root").replace(/:$/, ""));
document.title = `${baseNames.join(", ")} - Git Graph`;

control("summary").textContent =
  `Scanned ${DATA.roots.join(", ")} · Generated ${DATA.generated}`;

const yearSelect = control("year");
const years = [...new Set(
    DATA.commits.map(commit => new Date(commit.time * 1000).getFullYear()))]
  .sort((a, b) => b - a);
for (const year of years) {
  const option = document.createElement("option");
  option.value = String(year);
  option.textContent = String(year);
  yearSelect.appendChild(option);
}

if (!DATA.countLines) {
  const metricSelect = control("metric");
  metricSelect.disabled = true;
  metricSelect.title = "Line counts were not collected (--fast)";
}

for (const id of ["res", "stack", "metric", "year"])
  control(id).addEventListener("change", refresh);
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(refresh, 150);
});
refresh();
</script>
</body>
</html>
