<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Git Graph</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0;
         padding: 1.5rem 2rem; background: #fafafa; color: #222; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  h2 { font-size: 1rem; margin: 0; }
  .meta { color: #666; font-size: .85rem; margin-bottom: 1rem; }
  .controls { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap;
              background: #fff; border: 1px solid #ddd; border-radius: 6px;
              padding: .6rem 1rem; margin-bottom: 1.25rem; font-size: .9rem; }
  .controls label { margin-right: .4rem; color: #555; }
  select { font: inherit; padding: .15rem .3rem; }
  section.chart { background: #fff; border: 1px solid #ddd; border-radius: 6px;
                  padding: 1rem; margin-bottom: 1.25rem; }
  .chart-head { display: flex; gap: 1rem; align-items: center; margin-bottom: .5rem; }
  .chart-head label { font-size: .85rem; color: #555; }
  svg { display: block; width: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; margin-top: .6rem;
            font-size: .8rem; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend i { width: .8rem; height: .8rem; border-radius: 2px; display: inline-block; }
  .desc { margin-top: .8rem; font-size: .85rem; color: #444; line-height: 1.5; }
  .details { font-size: .85rem; color: #333; }
  .details-head { font-weight: 600; margin-bottom: .25rem; }
  .details ul { margin: .25rem 0 0; padding-left: 1.4rem; }
  .details ul ul { margin: .1rem 0; }
  .details li { margin: .1rem 0; }
  .details li i { width: .7rem; height: .7rem; border-radius: 2px;
                  display: inline-block; margin-right: .35rem; }
  .details .hint { color: #999; font-style: italic; }
  .details .muted { color: #999; }
  .empty { color: #888; font-style: italic; padding: 2rem; text-align: center; }
</style>
</head>
<body>
<h1>Git Graph</h1>
<div class="meta" id="summary"></div>
<div class="controls">
  <span><label for="res">Resolution</label>
    <select id="res">
      <option value="week">Week</option>
      <option value="month" selected>Month</option>
      <option value="year">Year</option>
    </select></span>
  <span><label for="metric">Metric</label>
    <select id="metric">
      <option value="commits" selected>Commits</option>
      <option value="lines">Lines changed</option>
    </select></span>
  <span><label for="stack">Stack bars by</label>
    <select id="stack">
      <option value="repo" selected>Repo</option>
      <option value="author">Author</option>
    </select></span>
  <span><label for="year">Year</label>
    <select id="year">
      <option value="all" selected>All</option>
    </select></span>
</div>
<section class="chart">
  <div id="chart"></div>
  <div id="legend" class="legend"></div>
  <div id="desc" class="desc"></div>
</section>
<div id="details" class="details"><span class="hint">Hover over the chart for details</span></div>
<script>
const DATA = __DATA__;
const NS = "http://www.w3.org/2000/svg";
const PALETTE = ["#4e79a7","#f28e2b","#e15759","#76b7b2","#59a14f","#edc948",
                 "#b07aa1","#ff9da7","#9c755f","#bab0ac","#8cd17d","#86bcb6"];
const TOP_N = 10;

const pad = n => String(n).padStart(2, "0");

function bucketStart(sec, res) {
  const d = new Date(sec * 1000);
  if (res === "year")  return new Date(d.getFullYear(), 0, 1).getTime() / 1000;
  if (res === "month") return new Date(d.getFullYear(), d.getMonth(), 1).getTime() / 1000;
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  day.setDate(day.getDate() - ((day.getDay() + 6) % 7)); // ISO week starts Monday
  return day.getTime() / 1000;
}

function nextBucket(sec, res) {
  const d = new Date(sec * 1000);
  if (res === "year")  return new Date(d.getFullYear() + 1, 0, 1).getTime() / 1000;
  if (res === "month") return new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime() / 1000;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7).getTime() / 1000;
}

function bucketLabel(sec, res) {
  const d = new Date(sec * 1000);
  if (res === "year")  return String(d.getFullYear());
  if (res === "month") return d.getFullYear() + "-" + pad(d.getMonth() + 1);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun",
                "Jul","Aug","Sep","Oct","Nov","Dec"];

function tickLabel(sec, res, showYear) {
  const d = new Date(sec * 1000);
  const yr = " '" + String(d.getFullYear()).slice(2);
  if (res === "year") return String(d.getFullYear());
  if (res === "month")
    return MONTHS[d.getMonth()] + (showYear || d.getMonth() === 0 ? yr : "");
  return MONTHS[d.getMonth()] + " " + d.getDate() + (showYear ? yr : "");
}

function metricValue(c, metric) {
  return metric === "lines" ? c.p + c.m : 1;
}

function aggregate(res, stackBy, metric, commits, showYear) {
  const buckets = new Map();   // startSec -> Map<series, value>
  const totals = new Map();    // series -> total
  const cross = new Map();     // `${b}|${key}` -> Map<other-dim key, value>
  for (const c of commits) {
    const key = stackBy === "author" ? c.a : DATA.repos[c.r];
    const okey = stackBy === "author" ? DATA.repos[c.r] : c.a;
    const b = bucketStart(c.t, res);
    if (!buckets.has(b)) buckets.set(b, new Map());
    const m = buckets.get(b);
    const v = metricValue(c, metric);
    m.set(key, (m.get(key) || 0) + v);
    totals.set(key, (totals.get(key) || 0) + v);
    const ck = b + "|" + key;
    if (!cross.has(ck)) cross.set(ck, new Map());
    const cm = cross.get(ck);
    cm.set(okey, (cm.get(okey) || 0) + v);
  }
  const ordered = [...totals.entries()].sort((x, y) => y[1] - x[1]).map(e => e[0]);
  const series = ordered.slice(0, TOP_N);
  if (ordered.length > TOP_N) series.push("Other");
  const starts = [...buckets.keys()].sort((a, b) => a - b);
  const rows = [];
  if (starts.length)
    for (let b = starts[0]; b <= starts[starts.length - 1]; b = nextBucket(b, res)) {
      const m = buckets.get(b) || new Map();
      const cells = series.map(s => {
        if (s === "Other") {
          let v = 0;
          for (const [k, n] of m) if (!series.includes(k)) v += n;
          return v;
        }
        return m.get(s) || 0;
      });
      const crow = new Map();
      for (const k of m.keys()) {
        const cm = cross.get(b + "|" + k);
        if (cm) crow.set(k, [...cm.entries()].sort((a, b) => b[1] - a[1]));
      }
      rows.push({ start: b, label: bucketLabel(b, res),
                  tick: tickLabel(b, res, showYear), cells, cross: crow,
                  other: series.includes("Other")
                    ? [...m.entries()]
                        .filter(([k]) => !series.includes(k))
                        .sort((a, b) => b[1] - a[1])
                    : null,
                  total: cells.reduce((a, x) => a + x, 0) });
    }
  return { series, rows };
}

function niceMax(v) {
  if (v <= 0) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  for (const f of [1, 2, 2.5, 5, 10]) if (v <= f * pow) return f * pow;
  return 10 * pow;
}

function el(name, attrs) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function textEl(x, y, str, attrs) {
  const t = el("text", Object.assign({ x, y, "font-size": 11, fill: "#555" }, attrs));
  t.textContent = str;
  return t;
}

function fmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(n % 1e3 ? 1 : 0) + "k";
  return String(Math.round(n * 100) / 100);
}

function mutedSpan(pairs) {
  const sp = document.createElement("span");
  sp.className = "muted";
  sp.textContent = " (" +
    pairs.map(([n, v]) => `${n}: ${v.toLocaleString()}`).join(", ") + ")";
  return sp;
}

function showDetails(details, row, series, metric) {
  details.innerHTML = "";
  const head = document.createElement("div");
  head.className = "details-head";
  head.textContent = `${row.label}: ${row.total.toLocaleString()} ` +
    (metric === "lines" ? "lines changed" : "commits");
  details.appendChild(head);
  const ul = document.createElement("ul");
  series.forEach((s, i) => {
    const v = row.cells[i];
    if (!v) return;
    const item = document.createElement("li");
    const sw = document.createElement("i");
    sw.style.background = PALETTE[i % PALETTE.length];
    item.appendChild(sw);
    item.appendChild(document.createTextNode(`${s}: ${v.toLocaleString()}`));
    const cx = row.cross.get(s);
    if (cx && cx.length) item.appendChild(mutedSpan(cx));
    if (s === "Other" && row.other) {
      const sub = document.createElement("ul");
      for (const [name, n] of row.other) {
        const li = document.createElement("li");
        li.appendChild(document.createTextNode(`${name}: ${n.toLocaleString()}`));
        const scx = row.cross.get(name);
        if (scx && scx.length) li.appendChild(mutedSpan(scx));
        sub.appendChild(li);
      }
      item.appendChild(sub);
    }
    ul.appendChild(item);
  });
  details.appendChild(ul);
}

function resetDetails() {
  document.getElementById("details").innerHTML =
    '<span class="hint">Hover over the chart for details</span>';
}

function render(res, stackBy, metric, commits, showYear) {
  const { series, rows } = aggregate(res, stackBy, metric, commits, showYear);
  const host = document.getElementById("chart");
  const legend = document.getElementById("legend");
  host.innerHTML = ""; legend.innerHTML = "";
  resetDetails();
  if (!rows.length) {
    host.innerHTML = '<div class="empty">No commits found</div>';
    return;
  }
  const W = Math.max(host.clientWidth, 320), H = 300;
  const m = { l: 56, r: 12, t: 10, b: 30 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const yMax = niceMax(Math.max(...rows.map(r => r.total)));
  const bw = Math.max((pw / rows.length) * 0.72, 1.5);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}` });

  for (let i = 0; i <= 4; i++) {
    const v = yMax * i / 4, y = m.t + ph - ph * i / 4;
    svg.appendChild(el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y,
                                 stroke: "#e6e6e6" }));
    svg.appendChild(textEl(m.l - 6, y + 4, fmt(v), { "text-anchor": "end" }));
  }
  const step = Math.ceil(rows.length / 12);
  rows.forEach((row, i) => {
    const x = m.l + pw * (i + 0.5) / rows.length;
    let y = m.t + ph;
    series.forEach((s, si) => {
      const v = row.cells[si];
      if (!v) return;
      const h = ph * v / yMax;
      y -= h;
      const r = el("rect", { x: x - bw / 2, y, width: bw, height: h,
                             fill: PALETTE[si % PALETTE.length] });
      svg.appendChild(r);
    });
    if (i % step === 0)
      svg.appendChild(textEl(x, m.t + ph + 16, row.tick,
        { "text-anchor": "middle" }));
  });
  svg.appendChild(el("line", { x1: m.l, x2: W - m.r, y1: m.t + ph, y2: m.t + ph,
                               stroke: "#999" }));
  const details = document.getElementById("details");
  svg.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const vx = (e.clientX - rect.left) * W / rect.width;
    const i = Math.min(rows.length - 1,
      Math.max(0, Math.floor((vx - m.l) * rows.length / pw)));
    showDetails(details, rows[i], series, metric);
  });
  svg.addEventListener("mouseleave", resetDetails);
  host.appendChild(svg);
  series.forEach((s, i) => {
    const item = document.createElement("span");
    const sw = document.createElement("i");
    sw.style.background = PALETTE[i % PALETTE.length];
    item.appendChild(sw);
    item.appendChild(document.createTextNode(s));
    legend.appendChild(item);
  });
}

function plural(n, singular, p) {
  return `${n} ${n === 1 ? singular : (p || singular + "s")}`;
}

function describe(commits) {
  const el = document.getElementById("desc");
  if (!commits.length) {
    el.textContent = "No commits in this selection.";
    return;
  }
  const authors = new Set(commits.map(c => c.a));
  const repos = new Set(commits.map(c => c.r));
  const byRepo = new Map(), byAuthor = new Map();
  let added = 0, deleted = 0;
  for (const c of commits) {
    byRepo.set(c.r, (byRepo.get(c.r) || 0) + 1);
    byAuthor.set(c.a, (byAuthor.get(c.a) || 0) + 1);
    added += c.p; deleted += c.m;
  }
  const top = m => [...m.entries()].sort((a, b) => b[1] - a[1])[0];
  const [ri, rn] = top(byRepo);
  const [an, ac] = top(byAuthor);
  const ts = commits.map(c => c.t);
  const fd = t => new Date(t * 1000).toLocaleDateString(
    "en-US", { year: "numeric", month: "short", day: "numeric" });
  el.textContent =
    `${plural(commits.length, "commit")} by ${plural(authors.size, "author")} ` +
    `across ${plural(repos.size, "repository", "repositories")} ` +
    `between ${fd(Math.min(...ts))} and ${fd(Math.max(...ts))}, ` +
    `changing ${fmt(added + deleted)} ${added + deleted === 1 ? "line" : "lines"} ` +
    `(+${fmt(added)} / -${fmt(deleted)}). ` +
    `Most active repository: ${DATA.repos[ri]} (${plural(rn, "commit")}). ` +
    `Top author: ${an} (${plural(ac, "commit")}).`;
}

function selectedCommits() {
  const year = document.getElementById("year").value;
  if (year === "all") return DATA.commits;
  const y = Number(year);
  return DATA.commits.filter(c => new Date(c.t * 1000).getFullYear() === y);
}

function refresh() {
  const commits = selectedCommits();
  render(document.getElementById("res").value,
         document.getElementById("stack").value,
         document.getElementById("metric").value,
         commits,
         document.getElementById("year").value === "all");
  describe(commits);
}

const baseName = DATA.root.split(/[\\/]/).filter(Boolean).pop() || "root";
document.title = `${baseName.replace(/:$/, "")} - Git Graph`;

document.getElementById("summary").textContent =
  `Scanned ${DATA.root} · Generated ${DATA.generated}`;

const yearSel = document.getElementById("year");
const years = [...new Set(DATA.commits.map(c => new Date(c.t * 1000).getFullYear()))]
  .sort((a, b) => b - a);
for (const y of years) {
  const opt = document.createElement("option");
  opt.value = String(y);
  opt.textContent = String(y);
  yearSel.appendChild(opt);
}

for (const id of ["res", "stack", "metric", "year"])
  document.getElementById(id).addEventListener("change", refresh);
let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(refresh, 150); });
refresh();
</script>
</body>
</html>
