[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-graph"
dynamic = ["version"]
description = "Recursively find git repositories and visualize commit activity over time"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
git-graph = "git_graph.cli:main"

[tool.setuptools.dynamic]
version = { attr = "git_graph.__version__" }

[tool.setuptools.packages.find]
include = ["git_graph*"]
